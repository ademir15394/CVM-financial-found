name: Deploy CVM Scraper to AWS ECR & Lambda

on:
  push:
    branches:
      - main

# Permissões estritamente necessárias para o OIDC do GitHub Actions autenticar na AWS
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "cvm-scrapers"
  # Substitua abaixo pelo ARN exato da Role gerada pelo Terraform (output github_actions_role_arn)
  ROLE_TO_ASSUME: "arn:aws:iam::SUA_CONTA_AWS_ID:role/cvm_github_actions_role_dev"

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Compila a imagem para arquitetura x86_64 (padrão do Lambda) e envia ao ECR com a tag do commit e 'latest'
          docker buildx build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .
          
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update AWS Lambda Functions Code
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          echo "Atualizando função Lambda: cvm-scraper-inf-cad..."
          aws lambda update-function-code \
            --function-name cvm-scraper-inf-cad \
            --image-uri $IMAGE_URI

          echo "Atualizando função Lambda: cvm-scraper-inf-cda..."
          aws lambda update-function-code \
            --function-name cvm-scraper-inf-cda \
            --image-uri $IMAGE_URI

          echo "Atualizando função Lambda: cvm-scraper-inf-daily..."
          aws lambda update-function-code \
            --function-name cvm-scraper-inf-daily \
            --image-uri $IMAGE_URI
            
      echo "Deploy concluído com sucesso em todas as funções Lambda!"
