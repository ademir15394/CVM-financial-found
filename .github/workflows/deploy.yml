name: Deploy CVM Scraper to AWS ECR & Lambda

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "cvm-scrapers"
  ROLE_TO_ASSUME: "arn:aws:iam::404438143202:role/cvm_github_actions_role_dev"

jobs:
  build-and-deploy:
    name: Build Docker Image & Push/Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials OIDC
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag and Push Image to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: build-image
        working-directory: cvmPipeline
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Define as tags dependendo da branch de origem
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TAGS="-t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest"
          else
            TAGS="-t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:dev"
          fi

          # Adicionado --provenance=false para garantir compatibilidade com o AWS Lambda
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            $TAGS \
            --push .
          
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update AWS Lambda Functions Code (Apenas na Main)
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          echo "Atualizando função Lambda: cvm-scraper-inf-cad..."
          aws lambda update-function-code \
            --function-name cvm-scraper-inf-cad \
            --image-uri $IMAGE_URI

          echo "Atualizando função Lambda: cvm-scraper-inf-cda..."
          aws lambda update-function-code \
            --function-name cvm-scraper-inf-cda \
            --image-uri $IMAGE_URI

          echo "Atualizando função Lambda: cvm-scraper-inf-daily..."
          aws lambda update-function-code \
            --function-name cvm-scraper-inf-daily \
            --image-uri $IMAGE_URI
            
          echo "Deploy concluído com sucesso em todas as funções Lambda!"